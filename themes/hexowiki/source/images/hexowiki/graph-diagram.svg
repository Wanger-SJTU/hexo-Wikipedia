<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" role="img" aria-labelledby="gr-title gr-desc">
  <title id="gr-title">关系图谱示意图</title>
  <desc id="gr-desc">节点按分组着色、以度数决定大小，连线表示双链关系。</desc>
  <style>
    .bg { fill: #f8f9fa; }
    .edge { stroke: #c8ccd1; stroke-width: 1.5; }
    .edge-strong { stroke: #a2a9b1; stroke-width: 2.5; }
    .lbl { font-family: -apple-system, "Segoe UI", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #202122; }
    .small { font-family: -apple-system, "Segoe UI", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #54595d; }
  </style>
  <rect class="bg" width="640" height="300"/>
  <g class="edge">
    <line x1="320" y1="150" x2="170" y2="86"/>
    <line x1="320" y1="150" x2="152" y2="212"/>
    <line x1="320" y1="150" x2="470" y2="82"/>
    <line x1="320" y1="150" x2="492" y2="206"/>
    <line x1="320" y1="150" x2="318" y2="252"/>
    <line x1="170" y1="86" x2="152" y2="212"/>
    <line x1="470" y1="82" x2="492" y2="206"/>
    <line x1="152" y1="212" x2="318" y2="252"/>
  </g>
  <line class="edge-strong" x1="320" y1="150" x2="470" y2="82"/>
  <circle cx="320" cy="150" r="26" fill="#3366cc"/>
  <circle cx="170" cy="86" r="17" fill="#d73333"/>
  <circle cx="152" cy="212" r="13" fill="#14866d"/>
  <circle cx="470" cy="82" r="20" fill="#ac6600"/>
  <circle cx="492" cy="206" r="15" fill="#8a4b9c"/>
  <circle cx="318" cy="252" r="11" fill="#3366cc"/>
  <circle cx="560" cy="144" r="8" fill="#0b6e8a" stroke="#a2a9b1" stroke-width="1.5"/>
  <text class="lbl" x="320" y="155" font-size="13" fill="#ffffff" text-anchor="middle">双链语法</text>
  <text class="small" x="170" y="58" font-size="12" text-anchor="middle">关系图谱</text>
  <text class="small" x="152" y="238" font-size="12" text-anchor="middle">链接统计</text>
  <text class="small" x="470" y="52" font-size="12" text-anchor="middle">知识图谱</text>
  <text class="small" x="492" y="232" font-size="12" text-anchor="middle">双链笔记</text>
  <text class="small" x="318" y="278" font-size="12" text-anchor="middle">多级目录</text>
  <text class="small" x="560" y="168" font-size="12" text-anchor="middle">孤立页</text>
  <g class="small" font-size="11">
    <circle cx="46" cy="282" r="6" fill="#3366cc"/>
    <text x="58" y="286">节点大小 = 链接度数</text>
    <circle cx="196" cy="282" r="6" fill="#ac6600"/>
    <text x="208" y="286">颜色 = 所属分组</text>
    <circle cx="330" cy="282" r="6" fill="#0b6e8a" stroke="#a2a9b1"/>
    <text x="342" y="286">虚线框 = 孤立页面</text>
  </g>
</svg>
